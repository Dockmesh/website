# Syncs the site from a Dockmesh release tag and lands it on main through a
# squash-merged PR, then waits until Cloudflare Workers Builds has deployed
# that commit and the release's changelog page is live. Docs and changelog
# come from the tag, never from the app's main: a patch released from a
# release branch is not on main until it is forward-ported. The app's release
# workflow dispatches `app-release` with {"tag": ...}.
name: release sync

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Dockmesh release tag (e.g. v0.5.1)
        required: true

permissions: {}

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    # GH_TOKEN is set only on the steps that call gh or push, so npm install scripts and the build never see it
    steps:
      # main, not the dispatching ref: a manual run from another branch must still sync main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm test

      - name: check tag and plan
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag \"$TAG\" is not vX.Y.Z"
            exit 1
          fi
          if ! rel=$(gh release view -R Dockmesh/dockmesh --json publishedAt,isPrerelease -- "$TAG"); then
            echo "::error::$TAG is not a release of Dockmesh/dockmesh"
            exit 1
          fi
          pre=()
          if [ "$(jq -r .isPrerelease <<<"$rel")" = true ]; then pre=(--prerelease); fi
          node scripts/release-sync.mjs plan "$TAG" "${pre[@]}" >> "$GITHUB_OUTPUT"
          published=$(jq -r .publishedAt <<<"$rel")
          echo "date=${published%%T*}" >> "$GITHUB_OUTPUT"

      - name: skip pre-release
        if: steps.rel.outputs.mode == 'skip'
        run: echo "::notice::$TAG is a pre-release; the site only follows stable releases"

      # an older minor's patch only adds its changelog page; docs and the current version stay
      - name: sync docs
        if: steps.rel.outputs.mode == 'full'
        run: npm run sync-docs -- "$TAG"

      - name: sync changelog
        if: steps.rel.outputs.mode != 'skip'
        run: node scripts/release-sync.mjs changelog "$TAG"

      - name: record release
        if: steps.rel.outputs.mode == 'full'
        env:
          DATE: ${{ steps.rel.outputs.date }}
        run: |
          jq -n --arg version "${TAG#v}" --arg date "$DATE" --arg tag "$TAG" \
            '{version: $version, date: $date, tag: $tag}' > src/data/release.json

      - name: build
        if: steps.rel.outputs.mode != 'skip'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          npm run build
          node scripts/release-sync.mjs check "$VERSION"

      - name: open and merge PR
        id: pr
        if: steps.rel.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.rel.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A src/content/docs/docs src/data
          if git diff --cached --quiet; then
            echo "main is already synced for $TAG"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MODE" = full ]; then
            pages=$(git diff --cached --name-only -- src/content/docs/docs | grep -c '\.md$' || true)
            if [ "$pages" -gt 0 ]; then docs="- Docs from Dockmesh $TAG, $pages pages changed"; else docs="- No docs changes in $TAG"; fi
            shown="- The site shows $TAG as the current version and lists it in the changelog"
          else
            docs="- Docs and the current version stay; $TAG is a patch of an older minor"
            shown="- The changelog lists $TAG"
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          **What**
          $docs
          $shown

          **Why**
          - Dockmesh $TAG was released

          **Tested**
          - Site build with the changelog of $TAG
          EOF

          branch="release-sync/$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q -m "docs: sync for $TAG"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -f origin "$branch"

          sha=$(git rev-parse HEAD)
          title="docs: sync for $TAG"

          # --head matches fork branches of the same name too; only reuse a PR this workflow opened
          num=$(gh pr list --base main --head "$branch" --state open --json number,title,author,isCrossRepository |
            jq -r --arg t "$title" '[.[] | select(.isCrossRepository == false and .author.login == "app/github-actions" and .title == $t)][0].number // empty')
          if [ -z "$num" ]; then
            url=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")
            num=${url##*/}
          fi

          # mergeability is computed asynchronously right after the PR is opened
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$num" --squash --match-head-commit "$sha" --subject "$title (#$num)" --body-file "$RUNNER_TEMP/body.md"; then
              merged=$(gh pr view "$num" --json mergeCommit --jq '.mergeCommit.oid // empty')
              if [ -z "$merged" ]; then
                echo "::error::#$num reports no merge commit"
                exit 1
              fi
              echo "sha=$merged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::could not merge #$num; merge it by hand"
          exit 1

      - name: wait for the deploy
        if: steps.rel.outputs.mode != 'skip'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Workers Builds reports each build of main as a check run on the commit
          deadline=$((SECONDS + 1200))
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")] | sort_by(.id) | last // empty | "\(.status) \(.conclusion) \(.html_url)"' || true)
            case "$run" in
              "completed success "*) echo "deployed $SHA"; break ;;
              "completed "*) echo "::error::the Cloudflare build of $SHA failed: ${run#completed }"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no finished Cloudflare build for $SHA after 20 minutes (${run:-no check run}); retry the build in the Cloudflare dashboard"
              exit 1
            fi
            sleep 20
          done

      - name: check the live changelog page
        if: steps.rel.outputs.mode != 'skip'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          url="https://dockmesh.dev/changelog/$VERSION/"
          deadline=$((SECONDS + 600))
          while :; do
            code=$(curl -sS -o "$RUNNER_TEMP/page.html" -w '%{http_code}' "$url?sync=$SHA" || true)
            if [ "$code" = 200 ] && grep -q "Dockmesh $VERSION" "$RUNNER_TEMP/page.html"; then
              echo "$url is live"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$url answered HTTP ${code:-none} 10 minutes after the deploy of $SHA"
              exit 1
            fi
            sleep 20
          done
